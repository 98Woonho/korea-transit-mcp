<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-label="Claude Code에서 korea-transit MCP 도구로 대전 시청역 106번 도착 정보를 조회하는 데모">
  <!-- 2026-11-17 실제 TAGO API 응답으로 재구성한 데모. 18초 주기로 반복된다. -->
  <style>
    .ui { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    .mono { font-family: "JetBrains Mono", "D2Coding", Consolas, "Noto Sans Mono CJK KR", monospace; }
    .t { fill: #e6e6e6; font-size: 15px; }
    .prompt { fill: #f0a875; font-size: 16px; font-weight: 600; }
    .tool { fill: #8ab4f8; font-size: 14px; }
    .args { fill: #c3c7cf; font-size: 14px; }
    .res { fill: #8f96a3; font-size: 13.5px; }
    .ok { fill: #9ece6a; }
    .dot { fill: #9ece6a; }
    .hl { fill: #ffd479; font-weight: 600; }
    .title { fill: #c3c7cf; font-size: 13px; }
  </style>

  <!-- 반복 타이머 -->
  <rect width="0" height="0">
    <animate id="loop" attributeName="x" from="0" to="0" dur="18s" begin="0s;loop.end" />
  </rect>

  <!-- 창 -->
  <rect x="0" y="0" width="860" height="520" rx="12" fill="#1b1d23" />
  <rect x="0" y="0" width="860" height="36" rx="12" fill="#262932" />
  <rect x="0" y="24" width="860" height="12" fill="#262932" />
  <circle cx="20" cy="18" r="6" fill="#ff5f57" />
  <circle cx="40" cy="18" r="6" fill="#febc2e" />
  <circle cx="60" cy="18" r="6" fill="#28c840" />
  <text x="430" y="23" text-anchor="middle" class="ui title">Claude Code · MCP server: korea-transit</text>

  <!-- 질문 -->
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+0.4s" fill="freeze" />
    <text x="28" y="76" class="ui prompt">&gt; 대전 시청역에서 비래동 가는 106번 언제 와?</text>
  </g>

  <!-- 도구 1 -->
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+1.6s" fill="freeze" />
    <circle cx="34" cy="112" r="4" class="dot" />
    <text x="48" y="117" class="mono"><tspan class="tool">list_cities</tspan><tspan class="args">(query: "대전")</tspan></text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+2.2s" fill="freeze" />
    <text x="48" y="139" class="mono res">└ 대전광역시/계룡시 (cityCode 25)</text>
  </g>

  <!-- 도구 2 -->
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+3.0s" fill="freeze" />
    <circle cx="34" cy="168" r="4" class="dot" />
    <text x="48" y="173" class="mono"><tspan class="tool">search_bus_stops</tspan><tspan class="args">(cityCode: 25, name: "시청역")</tspan></text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+3.6s" fill="freeze" />
    <text x="48" y="195" class="mono res">└ 시청역 #32410 (DJB8002088), 시청역 #32390 (DJB8002969)  ← 이름이 같은 정류소 2곳</text>
  </g>

  <!-- 도구 3 -->
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+4.4s" fill="freeze" />
    <circle cx="34" cy="224" r="4" class="dot" />
    <text x="48" y="229" class="mono"><tspan class="tool">get_routes_at_stop</tspan><tspan class="args">(cityCode: 25, nodeId: "DJB8002088")</tspan></text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+5.0s" fill="freeze" />
    <text x="48" y="251" class="mono res">└ 106번: 다음 목련아파트 / <tspan class="ok">비래동종점 방면 ✓</tspan></text>
  </g>

  <!-- 도구 4 -->
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+5.8s" fill="freeze" />
    <circle cx="34" cy="280" r="4" class="dot" />
    <text x="48" y="285" class="mono"><tspan class="tool">get_bus_arrivals</tspan><tspan class="args">(cityCode: 25, nodeId: "DJB8002088", routeId: "DJB30300041")</tspan></text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+6.4s" fill="freeze" />
    <text x="48" y="307" class="mono res">└ 106번 간선 · 저상버스 · arrivalMin 4 · stopsAway 3</text>
  </g>

  <!-- 구분선 -->
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+7.4s" fill="freeze" />
    <line x1="28" y1="336" x2="832" y2="336" stroke="#343844" />
  </g>

  <!-- 답변 -->
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+7.8s" fill="freeze" />
    <text x="28" y="372" class="ui t">비래동종점 방면 106번은 <tspan class="hl">시청역(32410)</tspan> 정류장에서 타세요.</text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+8.6s" fill="freeze" />
    <text x="28" y="402" class="ui t">🚌 <tspan class="hl">약 4분 후</tspan> 도착 예정이고, 지금 3정류장 전에 있어요. (저상버스)</text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="0" begin="loop.begin" fill="freeze" />
    <set attributeName="opacity" to="1" begin="loop.begin+9.4s" fill="freeze" />
    <text x="28" y="432" class="ui t">길 건너편 시청역(32390)은 목원대학교 방면이니 헷갈리지 않게 주의하세요.</text>
  </g>

  <!-- 하단 캡션 -->
  <text x="832" y="500" text-anchor="end" class="ui" fill="#5c6370" font-size="12">공공데이터포털 TAGO 실제 응답(2026-11-17, 대전) 기반 재구성</text>
</svg>
