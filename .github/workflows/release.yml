# 태그(v*)를 push하면 npm 배포 → MCP 공식 레지스트리 갱신까지 자동으로 진행한다.
# - npm: Trusted Publishing(OIDC). 저장소에 npm 토큰을 두지 않는다.
# - MCP Registry: GitHub OIDC 로그인. 마찬가지로 시크릿 없음.
# 릴리스 방법은 docs/RELEASING.md 참고.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing, MCP Registry OIDC 로그인에 필요

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing 은 npm CLI 11.5.1 이상이 필요하다
      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g npm@^11.5.1
          npm -v

      - name: Tag must match package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전(v$PKG_VERSION)이 다릅니다."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # 이미 공개된 버전이면 건너뛴다 → 레지스트리 단계만 실패했을 때 Re-run 으로 이어서 진행 가능
      - name: Check if this version is already on npm
        id: npm_check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "spec=$NAME@$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION 은 이미 npm에 있습니다. 배포를 건너뜁니다."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # 위에서 검증·빌드를 마쳤으므로 prepublishOnly 는 건너뛴다
      - name: Publish to npm (Trusted Publishing)
        if: steps.npm_check.outputs.published != 'true'
        run: npm publish --ignore-scripts

      # npm 버전이 실제로 공개돼야 MCP 레지스트리 검증을 통과한다. 두 경우를 처리한다.
      #  - 반영 지연: 공개될 때까지 잠시 기다린다.
      #  - Staged(승인 대기, v0.2.1에서 실제로 겪음): 여기서 멈추고 안내한다 → 웹에서 2FA 승인 후 Re-run 하면
      #    위 단계가 "이미 배포됨"으로 건너뛰고 레지스트리 등록만 이어서 한다.
      - name: Wait until the version is live on npm
        env:
          SPEC: ${{ steps.npm_check.outputs.spec }}
        run: |
          for i in $(seq 1 12); do
            if npm view "$SPEC" version >/dev/null 2>&1; then
              echo "$SPEC 공개 확인"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SPEC 이 2분 안에 npm 조회에 나타나지 않았습니다. 반영이 늦는 것이면 잠시 뒤 Re-run 하세요(이미 배포된 버전은 건너뜀). npmjs.com > Staged Packages 에 있다면 승인 후 Re-run 하고, Trusted Publisher의 Allowed actions에 'npm publish'가 있는지 확인하세요."
          exit 1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # 공식 문서 방식: 고정 버전을 받아 Sigstore 서명을 검증한 뒤 사용
      - name: Install mcp-publisher (signature verified)
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error -o "$archive" "$base/$archive"
          curl --fail --location --silent --show-error -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
